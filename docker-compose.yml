version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taruna_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarunajuara_db}
      POSTGRES_USER: ${POSTGRES_USER:-taruna_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taruna_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - taruna_network

  backend:
    image: odoo:16.0
    container_name: taruna_odoo
    depends_on:
      - db
    ports:
      - "8070:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./backend/config:/etc/odoo
      - ./backend/custom_addons:/mnt/extra-addons
      - ./backend/logs:/var/log/odoo
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-taruna_admin}
      - PASSWORD=${POSTGRES_PASSWORD:-taruna_secure_password_2026}
    restart: unless-stopped
    networks:
      - taruna_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: taruna_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - taruna_network

  proxy:
    image: nginx:alpine
    container_name: taruna_nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - taruna_network

volumes:
  postgres_data:
  odoo_data:

networks:
  taruna_network:
    driver: bridge
